<div class="settings">
  <div class="field">
    <label for="algorithm-select">Wybrany algorytm</label>
    <p-select
      inputId="algorithm-select"
      [options]="algorithms"
      optionLabel="name"
      optionValue="id"
      [ngModel]="selectedAlgorithm()"
      (ngModelChange)="algorithmChange.emit($event)"
    />
  </div>
  <div class="field">
    <label id="size-label">Liczba elementów: {{ selectedSize() }}</label>
    <p-slider
      class="slider"
      [min]="5"
      [max]="30"
      [ngModel]="selectedSize()"
      (ngModelChange)="sizeChange.emit($event)"
      ariaLabelledBy="size-label"
    />
  </div>
  <div class="field">
    <label id="delay-label">Opóźnienie: {{ selectedDelay() }}</label>
    <p-slider
      class="slider"
      [min]="50"
      [max]="1000"
      [ngModel]="selectedDelay()"
      (ngModelChange)="delayChange.emit($event)"
      ariaLabelledBy="delay-label"
    />
  </div>

  <p-button label="Nowa tablica" severity="warn" (onClick)="shuffle.emit()" />

  <div class="field">
    <label for="image-input">Wgraj zdjęcie</label>
    <input
      #fileInput
      id="image-input"
      type="file"
      accept="image/*"
      (change)="onImageSelected($event)"
    />

    <p-button
      label="Usuń zdjęcie"
      severity="secondary"
      (onClick)="fileInput.value = ''; imageRemove.emit()"
    />
  </div>
</div>
